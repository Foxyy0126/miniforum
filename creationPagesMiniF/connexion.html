<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Miniforum -espace connexion</title>
</head>
<body>
  <header class="entete">
    <img src ="./images/image_renard.png" alt="Image du logo d'un renard">
        <!-- Titre du site + navigation-->
         <h1>MiniForum</h1>
  </header>
  <main>
    <h1>Connexion </h1>
        <form action="/connexion" method="post">
        <fieldset><legend>Vos identifiants</legend>
            <p>
                <label for="votrePseudo">Pseudo ou adresse email</label>
                <input type="text" id="votrePseudo" name="identifiant"  required>
           </p>
           <p>
                <label for="motPasseIdientif" >Mot de Passe</label>
                <input type="password" id="motPasseIdientif" name="motdepasse" minlength ="8">
           </p>
           <p>
                <label for="restConnexion">Rester connecté sur cet appareil</label>
                <input type ="checkbox" id="restConnexion" name="connexionIndefinie">
           </p>
           
        </fieldset>
       
        <button type="submit" class="bouton">Connexion</button>
        <p>
        <a  href="inscription.html">Inscription</a>
        </p>
        <p>
            <a href="index.html">Retour</a>
        </p>
       </form>  
  </main>





 <footer class="pied">
        <!-- Pied de page-->
         <p>MiniForum - Projet du cours de développement web </p>
        <p> Classe Passerelle-cfpt.i</p>
</footer>
</body>
</html>
