<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name= "viewport" content ="width= device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Miniforum -Accueil></title>
</head>
<body>
    <header class="entete">
      
        <form action="/inscription" method="get"></form>
        
       <img src ="./images/image_renard.png" alt="Image du logo d'un renard">
        <!-- Titre du site + navigation-->
         <h1>MiniForum</h1>
        
         <nav>
             <ul>
                 <li><a href="#index.html">Accueil</a></li>
                 <li><a href="sujet.html">Sujets</a></li>
                 <li><a href="inscription.html">S'inscrire</a></li>
                 <li><a href="connexion.html">Connexion</a></li>
                
                 
             </ul>
        </nav>
    </header>        
    
    <main>
        <!--Liste des sujets-->
        <section id ="sujets" class="liste-sujets">
            <h2>Sujets récents</h2>
                <article class="carte-sujets">
                    <h3>Sujets 1</h3>
                    <p><strong>Auteurs</strong> Catégorie</p>
                </article>
                <article class="carte-sujets">
                    <h3>Sujet 2</h3>
                   <p><strong>Auteurs</strong> Catégorie</p>
                </article>
                <article class="carte-sujets">
                    <h3>Sujets 3</h3>
                    <p><strong>Auteurs</strong> Catégorie</p>
                </article>


        </section>
        <section>
            <h2>Vos informations</h2>
            <form action="/topics" method="post">
                <fieldset>
                    <legend>Nouveau sujet</legend>
                         <p>
                               <label for="prenomUti">Pseudo :</label>
                               <input type="text" id ="prenomUti" name="pseudo" placeholder="ex :Alice" required>
                         </p>

                         <p>
                                <label for="sujet1">Titre du sujet</label>
                                <input type="text" id="sujet1" name="titre"  maxlength="80" required>

                         </p>
                         <p>
                                <label for="message1">Message</label>
                                <textarea id="message1" name="message"  rows ="6" maxlength="500" required></textarea>      
                         </p>
                          
                

                </fieldset>
                <fieldset>
                    <legend>Option de publication</legend>
                        <p>
                            <select id="catego" name="categorie" >
                              <option value="general">Général</option>
                              <option value="general">Aide</option>
                              <option value="general">Projets</option>
                            </select>
                        </p>
                        <p>
                             <label for="public" >Visibilité : public</label>
                                <input type="radio" id="public" name="visibilite" required checked>
                            <label for="prive" >privé</label>
                               <input type="radio" id="prive" name="visibilite" required >
                     </p>
            </fieldset>

            <button type="submit" class="bouton">Publier le sujet</button>
        </form>
       </section>     
    </main>
    <footer class="pied">
        <!-- Pied de page-->
         <p>MiniForum - Projet du cours de développement web </p>
        <p> Classe Passerelle-cfpt.i</p>
        </footer>
</body>
</html>
